# Manual GM-2 environment-exactness probe: proves launchd's plist
# EnvironmentVariables behavior on a live GUI domain and records the full
# delivered environment. Run on demand when re-validating on a new macOS
# (the same assertions now also run as GM-2 provider tests in ci.yml).
name: gm2-env-probe

on:
  workflow_dispatch:

jobs:
  env-probe:
    name: launchd env exactness probe
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run GM-2 env probe
        run: python3 spikes/Gm2Env/probe.py "$(pwd)/artifacts/gm2env"
