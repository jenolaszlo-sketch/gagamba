# Only the exact candidate sealed by a successful qualification run can be published.
name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Find successful qualification of this source commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id=$(gh run list --workflow qualify.yml --commit "$GITHUB_SHA" --status success --limit 100 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n 1)
          test -n "$run_id" || { echo 'No successful qualification for this source SHA' >&2; exit 1; }
          test "$(gh run view "$run_id" --json headSha --jq .headSha)" = "$GITHUB_SHA" || { echo 'Qualification source SHA mismatch' >&2; exit 1; }
          echo "QUALIFICATION_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - name: Download sealed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$QUALIFICATION_RUN_ID" --name qualified-release-candidate --dir "$RUNNER_TEMP/qualified"
      - name: Verify source, version, native evidence and exact package bytes
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(python -c 'import xml.etree.ElementTree as E; print(E.parse("Directory.Build.props").findtext(".//Version"))')
          fi
          python eng/qualification_gate.py verify --manifest "$RUNNER_TEMP/qualified/manifest.json" --source-sha "$GITHUB_SHA" --version "$version" --packages-dir "$RUNNER_TEMP/qualified/packages" --repo .
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push qualified packages
        shell: bash
        run: |
          for package in "$RUNNER_TEMP"/qualified/packages/*.nupkg; do
            dotnet nuget push "$package" --no-symbols --source https://api.nuget.org/v3/index.json --api-key '${{ steps.login.outputs.NUGET_API_KEY }}' --skip-duplicate
          done
          for package in "$RUNNER_TEMP"/qualified/packages/*.snupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key '${{ steps.login.outputs.NUGET_API_KEY }}' --skip-duplicate
          done
